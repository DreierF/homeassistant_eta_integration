name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Home Assistant, pinned in requirements_test.txt
          - name: latest HA
            python-version: "3.14"
            requirements: -r requirements_test.txt
          # Oldest Home Assistant supported according to hacs.json
          - name: HA 2025.5
            python-version: "3.13"
            requirements: >-
              "pytest-homeassistant-custom-component==0.13.246" "pycares<4.9" xmltodict
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.requirements }}
      - name: Run pytest
        run: pytest tests/ -v

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check custom_components
      - name: Check formatting
        run: ruff format --check custom_components
